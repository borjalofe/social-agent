[project]
name = "social-agent"
version = "0.0.0"
description = "Social Agent: multi-user editorial agents behind Siren"
readme = "README.md"
authors = [
    { name = "Borja LoFe", email = "im@borjalofe.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_agent"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyyaml>=6", "pip-audit>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
