name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
          POSTGRES_DB: social_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social -d social_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://social:social@localhost:5432/social_agent_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync and quality gates
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          uv run pip-audit
