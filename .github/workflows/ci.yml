name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync and quality gates
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          uv run pip-audit
